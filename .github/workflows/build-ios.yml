name: Build reVC iOS IPA

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-14
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure (iOS arm64, unsigned)
        run: |
          cmake -S native/ios -B build -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=13.0

      - name: Build
        run: |
          set -o pipefail
          xcodebuild -project build/revc_ios.xcodeproj \
            -target revc \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            -jobs $(sysctl -n hw.ncpu) \
            build 2>&1 | tee build.log

      - name: Package IPA
        run: |
          APP=$(find build -type d -name "*.app" -not -path "*_CodeSignature*" | head -1)
          echo "App bundle: $APP"
          rm -rf Payload
          mkdir Payload
          cp -R "$APP" Payload/
          zip -qry revc-ios.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: revc-ios-ipa
          path: revc-ios.ipa
          retention-days: 30

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
